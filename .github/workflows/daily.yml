name: Daily shortlist

# Runs the screener every weekday morning and publishes a fresh data.json.
# This runs on GitHub's servers, so your laptop does not need to be on.
#
# 02:15 UTC = 07:45 IST — before the 09:15 market open.
# GitHub's scheduler is best-effort and can be delayed 5-20 minutes at busy times,
# which is why this fires early.

on:
  schedule:
    - cron: '15 2 * * 1-5'
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the screener
        run: python screen.py --top 15 --out data.json

      - name: Sanity check the output
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('data.json'))
          n = len(d.get('shortlist', []))
          print(f"shortlist: {n} names, {d.get('fetched')} fetched, {d.get('passed_filters')} passed")
          if d.get('fetched', 0) < 300:
              sys.exit("Fetched too few stocks — the data source is probably rate-limiting. "
                       "Not publishing this run.")
          PY

      - name: Commit the new ranking
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          git diff --staged --quiet || git commit -m "Ranking for $(date -u +%Y-%m-%d)"
          git push
